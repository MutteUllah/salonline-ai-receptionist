name: Verify SalonLine
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: salonline_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: salonline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salonline_test -d salonline_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://salonline_test:disposable_ci_only@127.0.0.1:5432/salonline_test
